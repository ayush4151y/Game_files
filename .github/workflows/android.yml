name: Android test-ads APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - the-lost-route-godot-2-js-assets.zip
      - .github/workflows/android.yml

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_TEMPLATES_VERSION: 4.7.2.stable
  PROJECT_DIR: the-lost-route-godot-2
  # Throwaway key generated below; signs test APKs only, never a real release.
  CI_KS_PASS: ci-test-only-signing

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q the-lost-route-godot-2-js-assets.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" "build-tools;35.0.0" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ runner.os }}

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          mkdir -p ~/godot-bin
          curl -fL -o /tmp/godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-unzip
          mv "/tmp/godot-unzip/Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          curl -fL -o /tmp/templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/"${GODOT_TEMPLATES_VERSION}"

      - name: Point Godot at the SDK and JDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import assets
        run: ~/godot-bin/godot --headless --path "$PROJECT_DIR" --import

      - name: Run test suites
        run: |
          ~/godot-bin/godot --headless --path "$PROJECT_DIR" --script res://tests/check.gd
          ~/godot-bin/godot --headless --path "$PROJECT_DIR" --script res://tests/check_tap.gd

      - name: Generate throwaway signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/ci-test.keystore" \
            -storepass "$CI_KS_PASS" -keypass "$CI_KS_PASS" \
            -alias ci-test -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI Test,O=The Lost Route,C=IN"

      - name: Export release APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/ci-test.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ci-test
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ env.CI_KS_PASS }}
        run: |
          mkdir -p "$PROJECT_DIR/build"
          ~/godot-bin/godot --headless --path "$PROJECT_DIR" \
            --install-android-build-template \
            --export-release "Android" build/the-lost-route.apk
          ls -lh "$PROJECT_DIR/build/the-lost-route.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-lost-route-test-ads
          path: ${{ env.PROJECT_DIR }}/build/the-lost-route.apk
          if-no-files-found: error
          retention-days: 30
